# Foundry CI setup. Generated by `foundry template apply`; every job of foundry-stack.yml
# starts with it, after actions/checkout.
#
# Sets up Node 24 and Python 3.12, then runs each enabled pack's setup hook
# (scripts/foundry-quality/packs/<pack>/setup.sh <root> --project), which installs that pack's
# dependencies in its root: with --project the python pack also installs the project's
# requirements and its CI tools (pytest-cov, pip-audit) into this Python, for the tests. A pack
# without a setup hook needs no install.
name: foundry-setup
description: Node, Python and the dependencies of every enabled Foundry stack pack

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24.22.2"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install each enabled pack's dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/foundry-ci/run.py pack roots > "$RUNNER_TEMP/foundry-pack-roots.tsv"
        if [ ! -s "$RUNNER_TEMP/foundry-pack-roots.tsv" ]; then
          echo "::error::no stack pack is enabled in foundry.json; enable one or delete .github/workflows/foundry-stack.yml"
          exit 1
        fi
        while IFS=$'\t' read -r pack root; do
          hook="scripts/foundry-quality/packs/$pack/setup.sh"
          if [ -f "$hook" ]; then
            echo "::group::setup $pack ($root)"
            sh "$hook" "$root" --project </dev/null
            echo "::endgroup::"
          fi
        done < "$RUNNER_TEMP/foundry-pack-roots.tsv"
