# Foundry end-to-end journeys (Playwright) for the react-vite app. Generated by
# `foundry template apply`. The job name `foundry / e2e (vite)` is a required status check.
# It builds Dockerfile.web, the image that ships, runs it, and points Playwright at it, so the
# journeys see nginx's real security headers. Everything runs in the react-vite pack root
# (foundry.json `packRoots`). Build-time values go in as build args in the "Build the image" step.
name: foundry-e2e-vite

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundry-e2e-vite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: foundry / e2e (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find the pack root
        env:
          PACK: react-vite
        run: |
          set -eu
          python3 scripts/foundry-ci/run.py pack roots >"$RUNNER_TEMP/foundry-pack-roots.tsv"
          root=$(awk -F '\t' -v p="$PACK" '$1 == p { print $2 }' "$RUNNER_TEMP/foundry-pack-roots.tsv")
          if [ -z "$root" ]; then
            echo "::error::$PACK is not in foundry.json packs; enable it or delete this workflow"
            exit 1
          fi
          echo "PACK_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install dependencies (npm, by lockfile)
        run: |
          set -eu
          cd "$PACK_ROOT"
          if [ ! -f package-lock.json ]; then
            echo "::error::$PACK_ROOT: Dockerfile.web installs with npm ci, so package-lock.json is required"
            exit 1
          fi
          npm ci
      - name: Install the Playwright browser
        run: |
          cd "$PACK_ROOT"
          npx playwright install --with-deps chromium
      - name: Build the image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          cd "$PACK_ROOT"
          docker build -f Dockerfile.web -t foundry-e2e-web .
      - name: Start the image and wait for /healthz
        run: |
          set -eu
          docker run -d --name foundry-e2e-web -p 127.0.0.1:8080:8080 foundry-e2e-web
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::/healthz did not answer within 120 seconds; the container log follows"
          docker logs foundry-e2e-web
          exit 1
      - name: Run the Playwright journeys
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          cd "$PACK_ROOT"
          npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ env.PACK_ROOT }}/playwright-report/
            ${{ env.PACK_ROOT }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
