# Foundry stack checks. Generated by `foundry template apply`.
#
# The four `foundry / ...` job names are required status checks. This workflow
# runs on pull_request ONLY, and its jobs have no `if:`: a skipped job with a
# required name counts as passing. Every job fails with a message, never skips,
# when it has nothing to check (no lockfile, no coverage file, no Semgrep).
#
# Every job checks out the PR with its history, restores the gate files from the base branch
# (scripts/foundry-quality/trusted-gate.sh; see D10 in the design) and only then runs the
# foundry-setup action (Node 24, Python 3.12 and each enabled pack's
# scripts/foundry-quality/packs/<pack>/setup.sh). The per-pack steps read the
# packs and their roots with `run.py pack roots`.
name: foundry-stack

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundry-stack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: foundry / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gate that judges a PR must not be the PR's own. This step restores the scripts inline,
      # so the script that restores the rest (trusted-gate.sh, which also takes foundry.json and
      # every guarded path from the base) is the base's, never the PR's. It runs again after
      # setup and after the project's tests, which execute PR code. Identical in every job.
      # A base without trusted-gate.sh (the PR that adopts Foundry) has no copy to trust: it warns
      # and the PR's own gate runs that once.
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - uses: ./.github/actions/foundry-setup
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - name: Run the project's verify entries for the ci stage
        run: python3 scripts/foundry-ci/run.py verify --stage ci

  coverage:
    name: foundry / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - uses: ./.github/actions/foundry-setup
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      # Each pack's coverage.sh writes <pack>.lcov with repo-relative paths (diff-cover cannot mix
      # lcov and XML reports). They are collected outside coverage/ first: a pack's own test run
      # may clean that folder.
      - name: Run each pack's tests with coverage
        run: |
          set -eu
          out="$RUNNER_TEMP/foundry-coverage"
          rm -rf "$out"
          mkdir -p "$out"
          python3 scripts/foundry-ci/run.py pack roots > "$RUNNER_TEMP/foundry-pack-roots.tsv"
          while IFS="$(printf '\t')" read -r pack root; do
            hook="scripts/foundry-quality/packs/$pack/coverage.sh"
            if [ ! -f "$hook" ]; then
              echo "::error::pack $pack is enabled but scripts/foundry-quality/packs/$pack/coverage.sh is missing; run foundry template apply"
              exit 1
            fi
            sh "$hook" "$root" "$out" </dev/null
          done < "$RUNNER_TEMP/foundry-pack-roots.tsv"
          rm -rf coverage
          mkdir coverage
          cp "$out"/* coverage/
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - name: Check the coverage paths map to repo files and cover every changed source file
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/foundry-quality/check-coverage.py coverage/* --base "origin/${BASE}"
      - name: Require 80 percent coverage on the changed lines
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          pip install diff-cover==10.6.0
          diff-cover coverage/* "--compare-branch=origin/${BASE}" \
            --fail-under=80 --json-report "$RUNNER_TEMP/diff.json"
          # The changed source files as check-coverage.py counts them (every pack's languages).
          changed=$(python3 scripts/foundry-quality/check-coverage.py --count-changed --base "origin/${BASE}")
          lines=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('total_num_lines', 0))" "$RUNNER_TEMP/diff.json")
          if [ "$changed" -gt 0 ] && [ "$lines" -eq 0 ]; then
            echo "::error::$changed changed source files but no changed line has coverage data; the gate checked nothing"
            exit 1
          fi

  quality:
    name: foundry / quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - uses: ./.github/actions/foundry-setup
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - name: Install Semgrep
        run: pip install semgrep==1.183.0
      - name: Quality run against the committed baseline (each pack's tools, then Semgrep)
        run: sh scripts/foundry-quality/run.sh check
      - name: No quality threshold may be raised against the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/foundry-ci/run.py quality raised --base "origin/${BASE}"

  security:
    name: foundry / security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      - uses: ./.github/actions/foundry-setup
      - name: Restore the gate files from the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          for p in scripts scripts/foundry-ci scripts/foundry-quality; do
            [ ! -L "$p" ] || { echo "::error::$p is a symlink; the gate cannot be restored"; exit 1; }
          done
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::origin/$BASE is not in this checkout"; exit 1; }
          git cat-file -e "origin/$BASE:scripts/foundry-quality/trusted-gate.sh" 2>/dev/null || { echo "::warning::origin/$BASE has no trusted-gate.sh yet; this PR's own gate runs"; exit 0; }
          for d in scripts/foundry-ci scripts/foundry-quality; do
            git rm -rqf --cached --ignore-unmatch -- "$d"; rm -rf -- "$d"; git checkout "origin/$BASE" -- "$d"
          done
          exec sh scripts/foundry-quality/trusted-gate.sh "origin/$BASE"
      # The gitleaks CLI needs no licence and no secrets, unlike the packaged Action in an organization.
      # Semgrep runs in the quality job. Only the commits of this PR are scanned.
      - name: Scan the PR commits for secrets (gitleaks 8.30.1)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts="origin/${BASE}..HEAD"
      # PIP_AUDIT_IGNORE (a repository variable) lists advisory IDs the python pack's audit skips;
      # each needs an `<ID>  # reason` line in quality/audit-ignore.txt, which the tech lead owns.
      - name: Audit each pack's dependencies (high and above fail)
        env:
          PIP_AUDIT_IGNORE: ${{ vars.PIP_AUDIT_IGNORE }}
        run: |
          set -eu
          python3 scripts/foundry-ci/run.py pack roots > "$RUNNER_TEMP/foundry-pack-roots.tsv"
          while IFS="$(printf '\t')" read -r pack root; do
            hook="scripts/foundry-quality/packs/$pack/audit.sh"
            if [ ! -f "$hook" ]; then
              echo "::error::pack $pack is enabled but scripts/foundry-quality/packs/$pack/audit.sh is missing; run foundry template apply"
              exit 1
            fi
            sh "$hook" "$root" </dev/null
          done < "$RUNNER_TEMP/foundry-pack-roots.tsv"
