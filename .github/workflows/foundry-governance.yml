# Foundry governance checks. Generated by `foundry template apply`.
#
# The three `foundry / ...` job names are required status checks (branch
# protection); do not rename them. The checks run from the BASE branch, so a
# PR cannot change the checker it is judged by. A PR can still edit this file;
# .github/workflows/ is CODEOWNERS-protected for that reason.
#
# This workflow runs on pull_request ONLY, and its jobs have no `if:`. A run
# from any other event would attach skipped check runs with the required
# names to the PR head, and GitHub counts a skipped required check as passing.
# A fourth job, `foundry / traceability`, is NOT a required check. It warns
# about requirement-to-test gaps and never fails the PR (D11). It runs the base
# copy of the checker on the PR head's foundry.json, docs/ and tests, which
# are extracted as data into head/ and never executed.
#
# The pull request that installs Foundry has a base branch with no
# scripts/foundry-ci/ yet. The three required jobs then print one notice and
# pass as not applicable (ruling R31), but only when the pull request targets the
# default branch; a pull request aimed at any other branch without it fails. If the checker exists, it always runs.
#
# Approval comments and reviews re-run this workflow's pull_request run from
# foundry-approval-rerun.yml instead.
name: foundry-governance

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    name: foundry / attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Check title, body, commit messages and authors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f scripts/foundry-ci/run.py ]; then
            if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::the base branch $BASE_REF has no Foundry CI; target $DEFAULT_BRANCH"
              exit 2
            fi
            echo "::notice::not applicable: the base branch has no Foundry CI yet (this pull request installs Foundry)"
            exit 0
          fi
          python3 scripts/foundry-ci/run.py check attribution --pr "$PR" --expect-head "$HEAD" --repo-slug "$REPO"

  plan-approved:
    name: foundry / plan-approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Check the tech lead approved the plan (every PR needs a story file, except a docs-only gate PR and a dependency-only Dependabot PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f scripts/foundry-ci/run.py ]; then
            if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::the base branch $BASE_REF has no Foundry CI; target $DEFAULT_BRANCH"
              exit 2
            fi
            echo "::notice::not applicable: the base branch has no Foundry CI yet (this pull request installs Foundry)"
            exit 0
          fi
          python3 scripts/foundry-ci/run.py check approval --pr "$PR" --expect-head "$HEAD" --repo-slug "$REPO" --kind plan

  gate-approved:
    name: foundry / gate-approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Check the tech lead approved every gate label on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f scripts/foundry-ci/run.py ]; then
            if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::the base branch $BASE_REF has no Foundry CI; target $DEFAULT_BRANCH"
              exit 2
            fi
            echo "::notice::not applicable: the base branch has no Foundry CI yet (this pull request installs Foundry)"
            exit 0
          fi
          python3 scripts/foundry-ci/run.py check approval --pr "$PR" --expect-head "$HEAD" --repo-slug "$REPO" --kind gates

  traceability:
    name: foundry / traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      # The checkout above keeps no credentials, so the fetch of the PR head
      # sends the job token itself, as an auth header set through the
      # environment (not argv) for this one command, and masked in the log.
      # Public and private repos both work. The whole head tree is archived
      # into $RUNNER_TEMP/head as data only: symlinks are deleted, nothing
      # in it is executed, and only the base copy of run.py runs.
      - name: Fetch the PR head as data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --depth=1 origin "$HEAD"
          mkdir -p "$RUNNER_TEMP/head"
          git archive "$HEAD" | tar -x -C "$RUNNER_TEMP/head"
          find "$RUNNER_TEMP/head" -type l -delete
      # PR-controlled text (file names, module names) reaches trace's output.
      # The report goes to the step summary (markdown, no workflow commands);
      # warnings are re-emitted with % CR and LF escaped, so each input line
      # becomes exactly one ::warning line and nothing can inject a command.
      - name: Report traceability gaps as warnings
        run: |
          rc=0
          python3 scripts/foundry-ci/run.py trace --repo "$RUNNER_TEMP/head" --gate pr > "$RUNNER_TEMP/trace.out" 2> "$RUNNER_TEMP/trace.err" || rc=$?
          cat "$RUNNER_TEMP/trace.out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "trace could not run (exit $rc)" > "$RUNNER_TEMP/trace.note"
          fi
          python3 -c '
          import os, sys
          def esc(t):
              return t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          with open(sys.argv[1], encoding="utf-8", errors="replace", newline="") as f:
              lines = f.read().split("\n")
          for line in lines:
              if line:
                  print("::warning title=foundry traceability::" + esc(line.removeprefix("warning: ")))
          if len(sys.argv) > 2 and os.path.exists(sys.argv[2]):
              print("::warning title=foundry traceability::" + esc(open(sys.argv[2]).read().strip()) + "; this check never fails the PR")
          ' "$RUNNER_TEMP/trace.err" "$RUNNER_TEMP/trace.note"
