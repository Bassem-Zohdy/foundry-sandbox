# Foundry container images. Generated by `foundry template apply`.
#
# `foundry / image (<name>)` scans every tracked **/Dockerfile.<name> with Trivy
# (config), builds it with its own folder as the context and scans the image with
# Trivy, on each pull request (required check) and on each push to the default
# branch. The image name is the suffix, so two Dockerfiles with one suffix fail the
# list job. A Node image is npm only (package-lock.json in the Dockerfile's folder, when that
# folder has a package.json); a pnpm-only folder fails with a message. A Python Dockerfile installs
# from uv.lock or requirements.txt itself and fails without either. Build args come from
# foundry.json `images.<name>.buildArgs` (`foundry image args <name>`), for example APP_MODULE for
# the python api image. `foundry / publish (<name>)` runs only on a push to the
# default branch and pushes the SAME image that was scanned, tagged by commit SHA
# (never `latest`), then prints its digest: promote that digest, not a rebuild.
#
# Registry: ghcr.io/<owner>/<repo>/<name> with GITHUB_TOKEN by default. To use
# another registry, in the `registry` environment set the environment variable
# REGISTRY (for example registry.example.com/team/app) and the secrets
# REGISTRY_USER and REGISTRY_TOKEN. When REGISTRY is set and a secret is missing
# the publish job fails; it never skips the push. Required reviewers on that
# environment hold the publish job until someone approves.
name: foundry-image

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: foundry-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dockerfiles:
    name: foundry / dockerfiles
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List the tracked Dockerfiles (**/Dockerfile.*)
        id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          tracked = subprocess.run(["git", "ls-files", "-z", "--", ":(glob)**/Dockerfile.*"],
                                   capture_output=True, check=True).stdout.decode().split("\0")
          files = sorted(p for p in tracked if p and not p.endswith(".dockerignore"))
          if not files:
              print("::error::no tracked **/Dockerfile.<name>; add one or delete foundry-image.yml", file=sys.stderr)
              sys.exit(1)
          bad = [p for p in files if not re.fullmatch(r"(?:[A-Za-z0-9._-]+/)*Dockerfile\.[a-z0-9][a-z0-9_-]*", p)]
          if bad:
              print("::error::Dockerfile names must be lowercase letters, digits, - or _, in folders "
                    "named with letters, digits, ., - or _: " + ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          by_name = {}
          for p in files:
              by_name.setdefault(p.rsplit("Dockerfile.", 1)[1], []).append(p)
          clash = [" and ".join(ps) for ps in by_name.values() if len(ps) > 1]
          if clash:
              print("::error::two Dockerfiles give the same image name: " + "; ".join(clash), file=sys.stderr)
              sys.exit(1)
          include = [{"name": p.rsplit("Dockerfile.", 1)[1], "file": p, "dir": os.path.dirname(p) or "."}
                     for p in files]
          print("matrix=" + json.dumps({"include": include}))
          PY

  image:
    name: foundry / image (${{ matrix.name }})
    needs: dockerfiles
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dockerfiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A Node Dockerfile runs `npm ci`: Node images are npm only in this version. A folder with
      # no package.json holds another stack's image (a Python one checks its own lockfile).
      - name: Check the lockfile (Node images are npm only)
        env:
          FILE: ${{ matrix.file }}
          DIR: ${{ matrix.dir }}
        run: |
          set -eu
          if [ ! -f "$DIR/package.json" ]; then
            echo "$FILE: $DIR has no package.json, so the npm lockfile check does not apply"
          elif [ ! -f "$DIR/package-lock.json" ]; then
            if [ -f "$DIR/pnpm-lock.yaml" ]; then
              echo "::error::foundry images are npm only (package-lock.json); $DIR has only pnpm-lock.yaml. Change $FILE to install with pnpm, or use npm"
            else
              echo "::error::foundry images are npm only (package-lock.json); $DIR has no package-lock.json"
            fi
            exit 1
          fi
      # Misconfigurations in the Dockerfile itself (root user, secrets in ENV, ...), before the build.
      - name: Scan the Dockerfile with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.file }}
          severity: CRITICAL,HIGH
          exit-code: 1
      # BuildKit reads <Dockerfile>.dockerignore before .dockerignore, so each image keeps its own
      # ignore file. The context is the Dockerfile's folder: a pack in a folder builds from there.
      # Each line `foundry image args` prints (--build-arg=NAME=VALUE) is one argument.
      - name: Build
        env:
          DOCKER_BUILDKIT: "1"
          FILE: ${{ matrix.file }}
          DIR: ${{ matrix.dir }}
          NAME: ${{ matrix.name }}
        run: |
          set -eu
          python3 scripts/foundry-ci/run.py image args "$NAME" > "$RUNNER_TEMP/build-args"
          set --
          while IFS= read -r arg; do set -- "$@" "$arg"; done < "$RUNNER_TEMP/build-args"
          docker build -f "$FILE" "$@" -t "foundry-image-$NAME:ci" "$DIR"
      # CRITICAL and HIGH with a fix available fail the check. Unfixed ones are ignored
      # (ignore-unfixed): nobody can act on them, and they would block every merge.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: foundry-image-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - name: Save the scanned image for the publish job
        if: github.event_name == 'push'
        run: docker save foundry-image-${{ matrix.name }}:ci -o "$RUNNER_TEMP/image.tar"
      - name: Upload the scanned image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: foundry / publish (${{ matrix.name }})
    needs: [dockerfiles, image]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: registry
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dockerfiles.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}
      - name: Load, tag and push by commit SHA
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          NAME: ${{ matrix.name }}
        run: |
          set -eu
          if [ -n "$REGISTRY" ]; then
            if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
              echo "::error::REGISTRY is set but REGISTRY_USER or REGISTRY_TOKEN is missing; add both as secrets in the registry environment"
              exit 1
            fi
            host=${REGISTRY%%/*}
            repo=$REGISTRY/$NAME
            user=$REGISTRY_USER
            token=$REGISTRY_TOKEN
          else
            host=ghcr.io
            repo=ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/$NAME
            user=$ACTOR
            token=$GITHUB_TOKEN
          fi
          printf '%s' "$token" | docker login "$host" -u "$user" --password-stdin
          docker load -i "$RUNNER_TEMP/image.tar"
          docker tag "foundry-image-$NAME:ci" "$repo:${{ github.sha }}"
          docker push "$repo:${{ github.sha }}"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:${{ github.sha }}" | grep "^$repo@sha256:" | head -n 1)
          case $digest in
            *@sha256:*) ;;
            *) echo "::error::the registry returned no digest for $repo:${{ github.sha }}"; exit 1 ;;
          esac
          {
            echo "### Image $NAME"
            echo
            echo "Pushed digest, promote this and do not rebuild:"
            echo
            echo "\`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
