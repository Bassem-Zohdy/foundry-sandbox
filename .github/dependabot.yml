# Foundry: weekly dependency updates. Libraries (npm, pip) and GitHub Actions: minor and patch grouped
# into one PR per ecosystem, and no major version PRs. Base images (docker): patch updates only.
# GitHub's options reference says `ignore` also affects security updates, so a security fix that needs a
# major (or, for images, minor) version may be suppressed too. Foundry's sandbox repo checks this; until
# then watch the Dependabot security alerts and the image scan.
# A major or minor upgrade is made by hand, as a normal story.
# Generated by `foundry template apply`: one entry per ecosystem and pack root of the enabled packs.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-patch:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      docker-patch:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
