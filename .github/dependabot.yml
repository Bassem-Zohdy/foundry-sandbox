# Foundry: weekly dependency updates, minor and patch grouped into one PR per ecosystem.
# Major updates arrive one PR each so a breaking change gets its own review.
# Generated by `foundry template apply`: one entry per ecosystem and pack root of the enabled packs.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
