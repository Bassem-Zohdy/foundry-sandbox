# Foundry: nginx for the built single-page app. Dockerfile.web copies this file to
# /etc/nginx/templates/default.conf.template; at start the image's envsubst step writes it to
# /etc/nginx/conf.d/default.conf with ${API_ORIGIN} replaced (only that variable: nginx's own
# $uri stays). API_ORIGIN is the API's origin (https://api.example.com), or empty when the API
# is this host. See docs/foundry/stacks/react-vite.md.

# Vite puts hashed files in /assets/: they never change, so browsers keep them a year.
# index.html and everything else is checked on each load, so a deploy shows at once.
map $uri $foundry_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every header is set here, at server level: an add_header inside a location would drop
    # all of these for that location. `always` adds them to error responses too, except
    # Cache-Control: a 404 for a new hash (an old pod in a rolling deploy) must never be cached.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $foundry_cache_control;

    # Liveness for the HEALTHCHECK and the platform: static, so it says nginx serves.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing hashed file is a 404, never the app's HTML with a JavaScript content type.
    location /assets/ {
        try_files $uri =404;
    }

    # The app routes in the browser: a deep link such as /settings gets index.html.
    location / {
        try_files $uri /index.html;
    }
}
