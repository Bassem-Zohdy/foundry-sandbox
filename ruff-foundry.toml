# Foundry's ruff rules for this pack root. The quality hook always runs
# `ruff check --config ruff-foundry.toml`, so a project's own ruff.toml or [tool.ruff] cannot
# weaken the gate; keep the project's formatting and extra rules there.
# Guarded: the tech lead owns this file (CODEOWNERS).
#
# Bandit (S) results are advisory: the hook rewrites them to warnings, which are listed and not
# counted. File length, function length, nesting and parameter count come from py_limits.py.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C90", "PLR0911", "PLR0912", "PLR0915", "S"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-branches = 10
max-statements = 40

[lint.per-file-ignores]
# pytest asserts are how tests check things.
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
"**/*_test.py" = ["S101"]
"**/conftest.py" = ["S101"]
